<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>All Projects — PCPS Project Vault</title>
  <meta name="description" content="Browse and filter every final year project in the archive." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/pages/projects.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pv:theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="projects">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header" data-header>
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="Project Vault — home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" /><path d="M3 12.5 12 17l9-4.5" /><path d="M3 17.5 12 22l9-4.5" />
          </svg>
        </span>
        <span class="brand__text">PCPS Project<span class="brand__accent">Vault</span></span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="index.html" data-nav="home">Home</a></li>
          <li><a class="site-nav__link" href="projects.html" data-nav="projects">Projects</a></li>
            <li><a class="site-nav__link" href="why.html" data-nav="why">Why</a></li>
          <!-- <li><a class="site-nav__link" href="index.html#how-it-works" data-nav="how">How it works</a></li> -->
        </ul>
      </nav>
      <div class="site-header__actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle colour theme" aria-pressed="false">
          <svg class="icon-btn__icon icon-btn__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-btn__icon icon-btn__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
        <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation menu">
          <span class="nav-toggle__bars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Projects</span>
        </nav>
        <h1 class="page-head__title">All projects</h1>
        <p class="page-head__lead">
          <span data-result-count>—</span> projects documented by final year students.
        </p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="listing">
          <!-- Sidebar filters -->
          <aside class="listing__sidebar" aria-label="Filters">
            <form class="filters" data-filters>
              <div class="filters__group">
                <label class="filters__label" for="filter-q">Search</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
                  </svg>
                  <input id="filter-q" type="search" name="q" placeholder="Name, ID, project…" autocomplete="off" />
                </div>
              </div>

              <div class="filters__group">
                <span class="filters__label">Category</span>
                <div class="chip-row chip-row--wrap" data-filter-categories></div>
              </div>

              <div class="filters__group">
                <span class="filters__label">Batch</span>
                <div class="chip-row chip-row--wrap" data-filter-years></div>
              </div>

              <div class="filters__group">
                <span class="filters__label">Status</span>
                <div class="chip-row chip-row--wrap" data-filter-status></div>
              </div>

              <div class="filters__group">
                <label class="filters__label" for="filter-tech">Technology</label>
                <select id="filter-tech" name="tech" class="select">
                  <option value="">All technologies</option>
                </select>
              </div>

              <button class="btn btn--ghost btn--block" type="reset" data-filters-reset>Reset filters</button>
            </form>
          </aside>

          <!-- Results -->
          <div class="listing__main">
            <div class="listing__toolbar">
              <p class="listing__count" data-result-count-inline>—</p>
              <div class="listing__sort">
                <label for="sort" class="visually-hidden">Sort by</label>
                <select id="sort" class="select" data-sort>
                  <option value="newest">Newest first</option>
                  <option value="oldest">Oldest first</option>
                  <option value="name">Project name (A–Z)</option>
                  <option value="student">Student name (A–Z)</option>
                </select>
              </div>
            </div>

            <div class="grid grid--cards" data-projects aria-live="polite" aria-busy="true"></div>

            <nav class="pagination" data-pagination aria-label="Pagination"></nav>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div class="site-footer__brand">
        <a class="brand" href="index.html">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" /><path d="M3 12.5 12 17l9-4.5" /><path d="M3 17.5 12 22l9-4.5" />
            </svg>
          </span>
          <span class="brand__text">Project<span class="brand__accent">Vault</span></span>
        </a>
        <p class="site-footer__note">An open archive of final year projects.</p>
      </div>
    </div>
    <div class="container site-footer__bottom">
      <p>© <span data-year>2025</span> Project Vault.</p>
      <p class="site-footer__meta">Last updated <span data-last-updated>—</span></p>
    </div>
  </footer>

  <div class="toast-stack" data-toast-stack aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
